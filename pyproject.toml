[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "finops-warehouse-optimizer"
version = "0.1.0"
description = "Attribute warehouse spend to queries, users, and teams; estimate what a filter, a cache, or an incremental load would recover."
requires-python = ">=3.11"
dependencies = [
  "duckdb>=1.1,<2",
  "pandas>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8,<1",
]

[project.scripts]
finops-report = "finops_optimizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
finops_optimizer = ["report.html"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
